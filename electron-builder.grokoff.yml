appId: app.grokoff.desktop
productName: GrokOff
artifactName: GrokOff-${version}-${arch}.${ext}
protocols:
  - name: GrokOff package install
    schemes:
      - grokoff
publish: null
directories:
  buildResources: build
  output: release-grokoff
afterPack: ./scripts/after-pack.mjs
files:
  - electron/**
  - "!electron/**/*.test.*"
  - "!electron/resources/speech-helper"
  - "!electron/resources/speech-helper.swift"
  - "!electron/resources/speech-helper-Info.plist"
  - "!electron/resources/OpenMausBot Speech.app/**"
  - "!electron/resources/recorder-helper"
  - "!electron/resources/recorder-helper.swift"
  - "!electron/resources/recorder-helper-Info.plist"
  - "!electron/resources/OpenMausBot Recorder.app/**"
  - "!**/node_modules/**"
  - package.json
  - "!electron/**/*.node-test.mjs"
  - "!electron/resources/GrokOff Speech.app/**"
asar: true
extraResources:
  - from: LICENSE
    to: licenses/OpenMausBot-LICENSE.txt
  - from: NOTICE
    to: licenses/OpenMausBot-NOTICE.txt
  - from: LICENSE
    to: licenses/cloudflared-LICENSE.txt
  - from: third_party/cloudflared/README.md
    to: licenses/cloudflared-README.md
  - from: third_party/hpke-js/core-LICENSE.txt
    to: licenses/hpke-core-LICENSE.txt
  - from: third_party/hpke-js/common-LICENSE.txt
    to: licenses/hpke-common-LICENSE.txt
  - from: third_party/models-dev/LICENSE
    to: licenses/models-dev-LICENSE.txt
  - from: third_party/opencode/LICENSE
    to: licenses/opencode-LICENSE.txt
  - from: dist
    to: ui
  - from: dist-server
    to: server
  - from: dist-companion
    to: companion
  - from: skills
    to: skills
  - from: UPSTREAM.md
    to: licenses/GrokOff-UPSTREAM.md
  - from: LICENSING.md
    to: licenses/LICENSING.md
  - from: third_party
    to: licenses/third_party
mac:
  target:
    - target: dir
      arch:
        - arm64
  icon: build/icon.icns
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extraResources:
    - from: electron/resources/GrokOff Speech.app
      to: GrokOff Speech.app
    - from: dist-native/${arch}/cua-driver
      to: cua-driver
    - from: dist-native/${arch}/cua-sdk
      to: cua-sdk
    - from: dist-native/cloudflared/darwin-${arch}/cloudflared
      to: cloudflared/cloudflared
    - from: dist-native/browser/darwin-${arch}
      to: browser-engine
  extendInfo:
    NSMicrophoneUsageDescription: GrokOff uses the microphone for voice dictation into the composer.
    NSSpeechRecognitionUsageDescription: GrokOff transcribes your voice on-device to type messages for you.
    NSAccessibilityUsageDescription: GrokOff uses Accessibility when you let a bot control this Mac.
    NSScreenCaptureUsageDescription: GrokOff uses Screen Recording so bots can see this Mac before acting.
  notarize: false
  identity: null
