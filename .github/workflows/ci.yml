name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Source checks (Node 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CI: true
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
        with:
          version: 10.33.0
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.x
          cache: pnpm
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check translations
        run: pnpm i18n:check
      - name: Check Electron module syntax
        run: pnpm check:electron
      - name: Typecheck and build UI
        run: pnpm build
      - name: Run maintained fork tests
        run: pnpm test:core
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
      - name: Report test retries
        if: ${{ !cancelled() }}
        run: node scripts/testing/ci-retry-summary.mjs
        env:
          OMB_VITEST_RETRY_LOG: ${{ runner.temp }}/vitest-retries.jsonl
      - name: Build and smoke-test bundled server
        run: pnpm test:packaged-server
