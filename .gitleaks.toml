[[rules]]
id = "jwt"

# Fixed redaction vectors: dummy credentials, sample JWT and synthetic PEM.
[[rules.allowlists]]
description = "Fixed redaction vectors: dummy credentials, sample JWT and synthetic PEM."
condition = "AND"
paths = [ '''^server/redact\.test\.ts$''' ]
regexTarget = "secret"
regexes = [ '''^(?:eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.SflKxwRJSMeKKF2QT4fwpMeJf36POk6yJV_adQssw5c)$''' ]

[[rules]]
id = "private-key"

# Fixed diagnostic redaction inputs, including a synthetic PEM body.
[[rules.allowlists]]
description = "Fixed diagnostic redaction inputs, including a synthetic PEM body."
condition = "AND"
paths = [ '''^electron/diagnostics\.test\.mjs$''' ]
regexTarget = "secret"
regexes = [ '''^(?:-----BEGIN PRIVATE KEY-----",
        "super-secret-line-one",
        "super-secret-line-two",
        "-----END PRIVATE KEY-----)$''' ]

# Fixed redaction vectors: dummy credentials, sample JWT and synthetic PEM.
[[rules.allowlists]]
