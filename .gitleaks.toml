condition = "AND"
paths = [ '''^server/redact\.test\.ts$''' ]
regexTarget = "secret"
regexes = [ '''^(?:-----BEGIN OPENSSH PRIVATE KEY-----\\nb3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW\\n-----END OPENSSH PRIVATE KEY-----)$''' ]

[[rules]]
