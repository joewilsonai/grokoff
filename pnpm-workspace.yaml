# GrokOff modification (2026-10-08): changed this imported OpenMausBot community file for the independent GrokOff fork.
# pnpm 11 reads allowBuilds, pnpm 10 reads onlyBuiltDependencies — keep both
# so either version runs the postinstalls this project actually needs.
# A packages list is required for `pnpm list` (electron-builder's collector).
packages:
  - "."
  - "apps/docs"
  - "cloudflare/control-plane"
# Packaging fetches optional binaries for both desktop CPU targets. This lived
# in package.json's "pnpm" field, which pnpm 10.33 ignores — it printed a
# warning on every command and, more to the point, silently was not applied.
supportedArchitectures:
  cpu:
    - arm64
    - x64
allowBuilds:
  electron: true # postinstall downloads the Electron dist
  esbuild: true # postinstall validates the platform binary
  electron-winstaller: false # unused — Windows builds ship NSIS
  core-js: false # optional polyfill postinstall is unnecessary
  workerd: false # hosted Cloudflare builds are outside the local Mac edition
onlyBuiltDependencies:
  - electron
  - esbuild
# mermaid 12.1 still allows dompurify 3.4.13. Force the patched release.
overrides:
  dompurify: 3.4.16
  # Patch the inherited Next peer as well as the docs app's direct pin.
  next@16.3.2: 16.3.8
  # Next and Miniflare use this same release line; retain other sharp minors.
  sharp@>=0.35.0 <0.36.0: 0.35.5
